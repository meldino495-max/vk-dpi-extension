<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --text: #e8eef5;
        --accent: #2f8f5b;
        --card: rgba(255, 255, 255, 0.05);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 340px;
        font: 13px/1.45 "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
        color: var(--text);
        background: linear-gradient(160deg, #101820 0%, #1a2836 100%);
      }
      main {
        padding: 14px;
      }
      h1 {
        margin: 0 0 2px;
        font-size: 15px;
        font-weight: 650;
      }
      .sub {
        color: #9db0c3;
        margin-bottom: 10px;
        font-size: 12px;
      }
      .guide {
        background: var(--card);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 12px;
      }
      .guide-title {
        font-weight: 700;
        font-size: 13px;
        margin-bottom: 6px;
        color: #9fe3b5;
      }
      .guide ol {
        margin: 0;
        padding-left: 18px;
        color: #d5e2ef;
        font-size: 12px;
      }
      .guide li {
        margin: 3px 0;
      }
      .guide .tip {
        margin-top: 8px;
        font-size: 11px;
        color: #f0c98a;
        line-height: 1.4;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        background: var(--card);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        padding: 10px 12px;
      }
      .status {
        font-weight: 600;
      }
      .status.on {
        color: #62d28a;
      }
      .status.off {
        color: #f0b35a;
      }
      button#toggle {
        border: 0;
        border-radius: 8px;
        min-width: 88px;
        padding: 10px 14px;
        font: 600 14px/1.2 "Microsoft YaHei", "Segoe UI", sans-serif;
        cursor: pointer;
        color: #fff;
        background: var(--accent);
        white-space: nowrap;
      }
      button#toggle.off {
        background: #6b7280;
      }
      code {
        font-family: ui-monospace, Consolas, monospace;
        font-size: 11px;
        color: #d7e6f7;
      }
      .warn {
        margin-top: 10px;
        font-size: 11px;
        color: #d6c29a;
      }
      .warn.ok {
        color: #62d28a;
      }
      .warn.bad {
        color: #f0a0a0;
        font-weight: 600;
      }
      .meta {
        margin-top: 8px;
        font-size: 11px;
        color: #7f93a8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>VK DPI Proxy Helper</h1>
      <div class="sub">配合本地软件使用 · 只代理 VK · 不影响 YouTube</div>

      <div class="guide">
        <div class="guide-title">使用说明（三步）</div>
        <ol>
          <li>打开本地软件，点 <b>启动</b>（要显示「运行中」）</li>
          <li>回到这里，点右侧 <b>开启</b></li>
          <li>打开 <code>vk.com</code> / <code>vk.ru</code> 即可</li>
        </ol>
        <div class="tip">
          不用时：这里点「关闭」，软件点「停止」。<br />
          只开插件、不开软件 → 页面会一直转圈。<br />
          图片全糊/点不开：软件分段请选「稳妥 split」，插件 v1.1.1，必须角标 ON 且软件已点启动，再 Ctrl+F5。
        </div>
      </div>

      <div class="row">
        <div>
          <div class="status off" id="status">读取中…</div>
          <div class="sub" style="margin: 2px 0 0">
            代理 <code>127.0.0.1:8888</code>
          </div>
        </div>
        <button id="toggle" type="button">关闭</button>
      </div>
      <div class="warn" id="health"></div>
      <div class="meta">右侧按钮：灰色＝点它关闭 · 绿色＝点它开启</div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
