<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --bg: #0f1720;
        --card: #182230;
        --text: #e8eef5;
        --muted: #9db0c3;
        --accent: #2f8f5b;
        --danger: #b45309;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 300px;
        font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
        color: var(--text);
        background: linear-gradient(160deg, #101820 0%, #1a2836 100%);
      }
      main {
        padding: 14px 14px 12px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 15px;
        font-weight: 650;
      }
      .sub {
        color: #9db0c3;
        margin-bottom: 12px;
        font-size: 12px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        padding: 10px 12px;
      }
      .status {
        font-weight: 600;
      }
      .status.on {
        color: #62d28a;
      }
      .status.off {
        color: #f0b35a;
      }
      button {
        border: 0;
        border-radius: 8px;
        padding: 8px 12px;
        font-weight: 600;
        cursor: pointer;
        color: #fff;
        background: var(--accent);
      }
      button.off {
        background: #4b5563;
      }
      ol {
        margin: 12px 0 0;
        padding-left: 18px;
        color: #b7c6d6;
        font-size: 12px;
      }
      code {
        font-family: ui-monospace, Consolas, monospace;
        font-size: 11px;
        color: #d7e6f7;
      }
      .warn {
        margin-top: 10px;
        font-size: 11px;
        color: #d6c29a;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>VK DPI Proxy Helper</h1>
      <div class="sub">只把 VK 相关域名送到本地代理，YouTube 等直连。</div>
      <div class="row">
        <div>
          <div class="status" id="status">…</div>
          <div class="sub" style="margin: 2px 0 0">代理 <code>127.0.0.1:8888</code></div>
        </div>
        <button id="toggle" type="button">…</button>
      </div>
      <ol>
        <li>先运行本地软件并点「启动」</li>
        <li>再在本插件点「开启」</li>
        <li>打开 <code>https://vk.com</code></li>
        <li>不用时点「关闭」，避免影响其它站</li>
      </ol>
      <div class="warn">
        插件本身不能拆 TLS；真正绕 DPI 的是本地代理。请勿同时开系统全局代理。
      </div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
